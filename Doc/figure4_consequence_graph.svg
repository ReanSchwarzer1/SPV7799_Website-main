<line x1="20" y1="662" x2="1340" y2="662" stroke="#e1e5ea" stroke-width="1.5"/>
<circle cx="38" cy="690" r="13" fill="#b8621b"/><text x="38" y="695" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="62" y="696" font-size="17" fill="#1b2330"><tspan font-weight="700">Courtroom → Market floor.</tspan> The imatinib ruling (case 2) leaves the market open or closed; if the patent is granted, the gate is bolted.</text>
<circle cx="38" cy="726" r="13" fill="#b8621b"/><text x="38" y="731" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="62" y="732" font-size="17" fill="#1b2330"><tspan font-weight="700">Market floor → Ward.</tspan> The price index the player leaves sets the ward’s starting cost: that share of the $30,000 patented price.</text>
<circle cx="38" cy="762" r="13" fill="#b8621b"/><text x="38" y="767" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="62" y="768" font-size="17" fill="#1b2330"><tspan font-weight="700">Pipeline → Patent race.</tspan> The years before generic entry chosen in the pipeline set the prize size when the race opens.</text>
<circle cx="38" cy="798" r="13" fill="#b8621b"/><text x="38" y="803" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="62" y="804" font-size="17" fill="#1b2330"><tspan font-weight="700">Courtroom → Wage floor.</tspan> If the Bayer compulsory licence was refused, no Natco generic exists and the cheaper-market switch is welded shut.</text>
<text x="20" y="838" font-size="15" fill="#5b6672">Grey arrows: order of play. R: record room. Every module also moves the Access and Innovation meters, which the record rooms and the reckoning read back.</text>
</svg>